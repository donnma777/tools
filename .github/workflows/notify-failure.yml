# ワークフローが失敗したら Discord に通知します
#   対象 : 下の workflows に並べたもの（各ファイルの name: と一字一句同じにすること）
#          ワークフローを追加・改名したら、ここにも追記・修正する
#   準備 : Settings > Secrets and variables > Actions に DISCORD_WEBHOOK_URL を登録
#          （未登録なら警告だけ出して何もしない）
#   注意 : workflow_run は main（既定ブランチ）にあるこのファイルで動く。
#          キャンセルされた実行（cancel-in-progress など）は通知しない
name: 失敗を Discord に通知

on:
  workflow_run:
    workflows:
      - "Deploy to Xserver"
    types: [completed]

permissions: {}

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          COMMIT: ${{ github.event.workflow_run.head_commit.message }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL が未登録のため通知しません"
            exit 0
          fi
          # 名前やコミットメッセージに記号が入っても壊れないよう、JSON は jq で組み立てる
          jq -n \
            --arg title "❌ $WORKFLOW" \
            --arg url "$RUN_URL" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg event "$EVENT" \
            --arg actor "$ACTOR" \
            --arg commit "$(printf '%s' "$COMMIT" | head -n 1 | cut -c1-200)" \
            '{embeds: [{
              title: $title, url: $url, color: 15158332,
              description: "ワークフローが失敗しました",
              fields: [
                {name: "リポジトリ", value: $repo, inline: true},
                {name: "ブランチ", value: $branch, inline: true},
                {name: "きっかけ", value: ($event + " / " + $actor), inline: true},
                {name: "コミット", value: (if $commit == "" then "-" else $commit end)}
              ]
            }]}' \
          | curl -sS --fail -H "Content-Type: application/json" -X POST -d @- "$WEBHOOK"
