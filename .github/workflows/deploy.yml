# main への push で2か所へ公開します（詳しくは README の「公開・デプロイ」）
#   deploy        … 本番 https://donnma.com/tool/（Xserver・検索エンジンにインデックスさせる）
#   publish-pages … GitHub Pages https://tools.donnma.com/（gh-pages ブランチ・noindex 付き）
name: Deploy to Xserver

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-tool
  cancel-in-progress: true

jobs:
  # 本番（Xserver）: main をそのままアップロード。noindex は付けない。
  # --delete 付きのため、リポジトリで削除したファイルはサーバーからも消える。
  # サーバーに手動で置いているファイルは P（protect）で削除対象から外すこと。
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.XSERVER_SSH_KEY }}" > ~/.ssh/xserver_key
          chmod 600 ~/.ssh/xserver_key
          ssh-keyscan -p ${{ secrets.XSERVER_PORT }} ${{ secrets.XSERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          # --delete の誤爆防止: 転送先が tool ディレクトリでなければ中止
          case "${{ secrets.XSERVER_REMOTE_PATH }}" in
            */tool|*/tool/) ;;
            *) echo "XSERVER_REMOTE_PATH が /tool で終わっていません" >&2; exit 1 ;;
          esac
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/xserver_key -p ${{ secrets.XSERVER_PORT }}" \
            --filter='P /overlay/donnma/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='CNAME' \
            --exclude='README.md' \
            ./ ${{ secrets.XSERVER_USER }}@${{ secrets.XSERVER_HOST }}:${{ secrets.XSERVER_REMOTE_PATH }}/

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/xserver_key

  # GitHub Pages: 全HTMLに noindex を入れたコピーを gh-pages ブランチへ強制 push する。
  # 検索結果に本番（donnma.com）だけが出るようにするため。gh-pages は直接編集しないこと。
  publish-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Inject noindex into all HTML files
        run: |
          find . -path ./.git -prune -o -name '*.html' -print | while read -r f; do
            sed -i '0,/<head>/s//<head>\n  <meta name="robots" content="noindex">/' "$f"
          done

      - name: Publish to gh-pages branch
        run: |
          git config user.name "gh-pages-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -r --cached .github > /dev/null
          rm -rf .github README.md
          git add -A
          git commit -m "Publish noindex build from $(git rev-parse --short HEAD~0 2>/dev/null || echo main)"
          git push origin HEAD:gh-pages --force
