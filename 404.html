<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — どんまうんど-Tools</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* donnma.com と同じ配色（プラム × ピンク） */
    :root {
      --bg: #250e1c;
      --bg-deep: #1a0a14;
      --border: #46162e;
      --border-strong: #a03060;
      --accent: #ff85a1;
      --accent-soft: rgba(255, 133, 161, 0.12);
      --on-accent: #2a1020;
      --text: #f6e9ef;
      --muted: #c4a2b3;
      --cream: #f6f2e2;
      --plum-ink: #6e3551;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif;
      font-weight: 500;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* shared:header-footer */
    /* ── ヘッダー ── */
    .topnav {
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      background: var(--bg-deep);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topnav-inner {
      max-width: 1400px;
      margin: 0 auto;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topnav-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    a.topnav-brand:hover {
      opacity: 0.8;
    }

    .topnav-brand img {
      display: block;
      height: 26px;
      width: auto;
    }

    .topnav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .topnav-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-decoration: none;
      padding: 5px 10px;
      transition: color 0.15s;
    }

    .topnav-back:hover {
      color: var(--accent);
    }

    /* 「ツール一覧 ▾」はメニューを開くボタン */
    button.topnav-menu {
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      background: none;
      border: 0;
      cursor: pointer;
    }

    /* ── ツールの一覧（大きなメニュー） ── */
    html.toolmenu-open {
      overflow: hidden;
    }

    .toolmenu {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 64px 20px 20px;
      background: rgba(10, 4, 8, 0.72);
      backdrop-filter: blur(3px);
    }

    .toolmenu[hidden] {
      display: none;
    }

    .toolmenu-box {
      width: min(1180px, 100%);
      max-height: calc(100vh - 84px);
      display: flex;
      flex-direction: column;
      background: var(--surface, #2e1224);
      border: 1px solid var(--border-strong, #5e2340);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
      overflow: hidden;
    }

    .toolmenu-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border, #46162e);
    }

    .toolmenu-q {
      flex: 1;
      min-width: 0;
      font: inherit;
      font-size: 14px;
      color: var(--text, #f6e9ef);
      background: var(--bg-deep, #1a0a14);
      border: 1px solid var(--border-strong, #5e2340);
      border-radius: 10px;
      padding: 9px 12px;
    }

    .toolmenu-q:focus {
      outline: none;
      border-color: var(--accent, #ff85a1);
    }

    .toolmenu-top {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-2, #ffb3c6);
      text-decoration: none;
      white-space: nowrap;
    }

    .toolmenu-top:hover {
      text-decoration: underline;
    }

    .toolmenu-close {
      font: inherit;
      font-size: 20px;
      line-height: 1;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border-strong, #5e2340);
      background: none;
      color: var(--text, #f6e9ef);
      cursor: pointer;
    }

    .toolmenu-close:hover {
      border-color: var(--accent, #ff85a1);
    }

    .toolmenu-body {
      overflow: auto;
      padding: 6px 16px 18px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 6px 18px;
      align-items: start;
    }

    .toolmenu-sec h2 {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted, #c4a2b3);
      letter-spacing: 0.05em;
      margin: 12px 4px 6px;
    }

    .toolmenu-grid {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .toolmenu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 10px;
      color: var(--text, #f6e9ef);
      text-decoration: none;
    }

    .toolmenu-item[hidden] {
      display: none;
    }

    .toolmenu-item svg {
      width: 20px;
      height: 20px;
      flex: none;
      color: var(--accent, #ff85a1);
    }

    .toolmenu-item span {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .toolmenu-item b {
      font-size: 13.5px;
      font-weight: 700;
    }

    .toolmenu-item small {
      font-size: 11px;
      color: var(--muted, #c4a2b3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toolmenu-item:hover,
    .toolmenu-item:focus-visible {
      background: var(--surface-2, #38172c);
      outline: none;
    }

    .toolmenu-item.on {
      background: var(--accent-soft, rgba(255, 133, 161, 0.12));
      box-shadow: inset 3px 0 0 var(--accent, #ff85a1);
    }

    .toolmenu-foot {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
      padding: 10px 16px 12px;
      border-top: 1px solid var(--border, #46162e);
      background: var(--bg-deep, #1a0a14);
    }

    .toolmenu-foot a.toolmenu-foot-top {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 3px 12px 3px 10px;
      margin-right: 4px;
    }

    .toolmenu-foot-top img {
      height: 18px;
      width: auto;
      display: block;
    }

    .toolmenu-foot a {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text, #f6e9ef);
      text-decoration: none;
      border: 1px solid var(--border-strong, #5e2340);
      border-radius: 999px;
      padding: 4px 12px;
    }

    .toolmenu-foot a:hover {
      border-color: var(--accent, #ff85a1);
      color: var(--accent-2, #ffb3c6);
    }

    .toolmenu-none {
      grid-column: 1 / -1;
      color: var(--muted, #c4a2b3);
      font-size: 13px;
      padding: 16px 4px;
    }

    @media (max-width: 600px) {
      .toolmenu {
        padding: 0;
      }

      .toolmenu-box {
        max-height: 100vh;
        height: 100%;
        border-radius: 0;
      }

      .toolmenu-top {
        display: none;
      }
    }

    .topnav-site {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 14px;
      transition: color 0.15s, border-color 0.15s;
    }

    .topnav-site:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .topnav-site-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    /* ── フッター ── */
    footer {
      background: var(--bg-deep);
      border-top: 1px solid var(--border);
      padding: 28px 24px;
      font-size: 12px;
      color: var(--muted);
    }

    /* リンクは下線なし。マウスを乗せるとピンクになる */
    footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    footer a:hover {
      color: var(--accent);
    }

    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    footer a.footer-logo {
      transition: opacity 0.15s;
    }

    footer a.footer-logo:hover {
      opacity: 0.8;
    }

    .footer-logo img {
      display: block;
      height: 24px;
      width: auto;
    }

    .footer-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
      line-height: 1.6;
    }

    /* donnma.com のメニュー */
    .footer-menu {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    @media (max-width: 600px) {
      .topnav {
        padding: 0 16px;
      }

      /* スマホでも出す（ロゴ・donnma.com と並ぶように少し詰める） */
      .topnav-right {
        gap: 6px;
      }

      .topnav-back {
        font-size: 12px;
        padding: 5px 4px;
      }

      .topnav-site {
        font-size: 12px;
        padding: 4px 11px;
      }

      .topnav-brand img {
        height: 22px;
      }

      .topnav-back,
      .topnav-site {
        white-space: nowrap;
      }

      .footer-inner,
      .footer-brand {
        flex-direction: column;
        text-align: center;
      }

      .footer-menu {
        justify-content: center;
      }
    }

    /* 幅の狭いスマホ：ヘッダーが1行に収まるように、飾りから省く */
    @media (max-width: 400px) {
      .topnav-inner {
        gap: 8px;
      }

      .topnav-brand {
        gap: 6px;
      }

      .topnav-site {
        padding: 4px 9px;
      }

      .topnav-site-dot {
        display: none;
      }
    }

    @media (max-width: 340px) {
      .topnav-brand > span {
        display: none;
      }
    }
    /* /shared:header-footer */

    /* ページ全体をトップのヒーローと同じうさぎ柄にする */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      background: var(--cream) url("/image/pattern.svg?v=20260929") center top / 300px 300px repeat;
    }

    .container {
      text-align: center;
      max-width: 560px;
      padding: 32px 40px 36px;
      background: rgba(246, 242, 226, 0.94);
      border-radius: 28px;
      box-shadow: 0 0 0 6px rgba(246, 242, 226, 0.5);
    }

    .error-icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 8px;
      border-radius: 50%;
      background: #fff url("/image/icon.webp?v=20260929") center / cover no-repeat;
      box-shadow: 0 0 0 3px var(--accent);
    }

    .error-code {
      font-size: clamp(4rem, 16vw, 6.5rem);
      font-weight: 900;
      color: var(--accent);
      line-height: 1.1;
      letter-spacing: 0.05em;
    }

    .error-title {
      font-size: clamp(1.05rem, 3vw, 1.35rem);
      font-weight: 900;
      color: var(--plum-ink);
      margin-bottom: 12px;
    }

    .error-desc {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--plum-ink);
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      padding: 9px 22px;
      border-radius: 999px;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: var(--accent);
      color: var(--on-accent);
    }

    .btn-primary:hover { background: #ff9db3; }

    .btn-secondary {
      background: #fff;
      color: var(--plum-ink);
      border: 1.5px solid #f3c3d0;
    }

    .btn-secondary:hover { border-color: var(--accent); }

    @media (max-width: 600px) {
      main { padding: 32px 16px; }
      .container { padding: 26px 20px 28px; }

    }
  </style>
</head>
<body>

  <!-- shared:header root="/" -->
  <nav class="topnav">
    <div class="topnav-inner">
      <a class="topnav-brand" href="/"><img src="/image/logo.webp?v=20260929" alt="どんまうんど" width="720" height="182"><span>Tools</span></a>
      <div class="topnav-right">
        <a class="topnav-site" href="https://donnma.com/" target="_blank" rel="noopener">
          <span class="topnav-site-dot"></span>
          donnma.com
        </a>
      </div>
    </div>
  </nav>
  <!-- /shared:header -->

  <main>
    <div class="container">
      <div class="error-icon" aria-hidden="true"></div>
      <div class="error-code">404</div>
      <h1 class="error-title">ページが見つかりませんでした</h1>
      <p class="error-desc">
        お探しのページは存在しないか、移動・削除された可能性があります。<br>
        URLをご確認のうえ、トップページからお探しください。
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/">トップページへ戻る</a>
        <a class="btn btn-secondary" href="https://donnma.com/" target="_blank" rel="noopener">オフィシャルサイト</a>
      </div>
    </div>
  </main>

  <!-- shared:footer root="/" -->
  <footer>
    <div class="footer-inner">
      <div class="footer-brand">
        <a class="footer-logo" href="https://donnma.com/" target="_blank" rel="noopener"><img src="/image/logo.webp?v=20260929" alt="どんまうんど" width="720" height="182"></a>
        <div class="footer-copy">
          <span>© 2020-2026 <a href="https://donnma.com/" target="_blank" rel="noopener">donnma.com</a></span>
          <span>どんま / <a href="https://twitter.com/donnma777" target="_blank" rel="noopener">@donnma777</a></span>
          <span><a href="/terms/">利用規約</a></span>
        </div>
      </div>
      <nav class="footer-menu" aria-label="donnma.com のメニュー">
        <a href="https://donnma.com/blog/" target="_blank" rel="noopener">BLOG</a>
        <a href="https://donnma.com/profile/" target="_blank" rel="noopener">PROFILE</a>
        <a href="https://donnma.com/link/" target="_blank" rel="noopener">LINK</a>
        <a href="https://donnma.com/form/" target="_blank" rel="noopener">FORM</a>
        <a href="https://donnma.com/policy/" target="_blank" rel="noopener">POLICY</a>
      </nav>
    </div>
  </footer>
  <!-- /shared:footer -->

</body>
</html>
