<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — どんまうんど-Tools</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* donnma.com と同じ配色（プラム × ピンク） */
    :root {
      --bg: #250e1c;
      --bg-deep: #1a0a14;
      --border: #46162e;
      --border-strong: #a03060;
      --accent: #ff85a1;
      --accent-soft: rgba(255, 133, 161, 0.12);
      --on-accent: #2a1020;
      --text: #f6e9ef;
      --muted: #c4a2b3;
      --cream: #f6f2e2;
      --plum-ink: #6e3551;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Meiryo', sans-serif;
      font-weight: 500;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topnav {
      background: var(--bg-deep);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .topnav-inner {
      max-width: 1100px;
      margin: 0 auto;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .topnav-brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: var(--text);
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .topnav-brand:hover { opacity: 0.8; }

    .topnav-brand img {
      display: block;
      height: 26px;
      width: auto;
    }

    .topnav-site {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 14px;
      transition: color 0.15s, border-color 0.15s;
    }

    .topnav-site:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .topnav-site-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    /* ページ全体をトップのヒーローと同じうさぎ柄にする */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      background: var(--cream) url("/image/pattern.webp") center top / 256px 256px repeat;
    }

    .container {
      text-align: center;
      max-width: 560px;
      padding: 32px 40px 36px;
      background: rgba(246, 242, 226, 0.94);
      border-radius: 28px;
      box-shadow: 0 0 0 6px rgba(246, 242, 226, 0.5);
    }

    .error-icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 8px;
      border-radius: 50%;
      background: #fff url("/image/icon.png") 50% 20% / 110% auto no-repeat;
      box-shadow: 0 0 0 3px var(--accent);
    }

    .error-code {
      font-size: clamp(4rem, 16vw, 6.5rem);
      font-weight: 900;
      color: var(--accent);
      line-height: 1.1;
      letter-spacing: 0.05em;
    }

    .error-title {
      font-size: clamp(1.05rem, 3vw, 1.35rem);
      font-weight: 900;
      color: var(--plum-ink);
      margin-bottom: 12px;
    }

    .error-desc {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--plum-ink);
      line-height: 1.8;
      margin-bottom: 28px;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 700;
      padding: 9px 22px;
      border-radius: 999px;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover { transform: translateY(-1px); }

    .btn-primary {
      background: var(--accent);
      color: var(--on-accent);
    }

    .btn-primary:hover { background: #ff9db3; }

    .btn-secondary {
      background: #fff;
      color: var(--plum-ink);
      border: 1.5px solid #f3c3d0;
    }

    .btn-secondary:hover { border-color: var(--accent); }

    footer {
      background: var(--bg-deep);
      border-top: 1px solid var(--border);
      padding: 24px;
      font-size: 12px;
      color: var(--muted);
    }

    footer a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px solid var(--border-strong);
      transition: color 0.15s;
    }

    footer a:hover { color: var(--accent); }

    .footer-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    footer a.footer-logo {
      border-bottom: none;
      transition: opacity 0.15s;
    }

    footer a.footer-logo:hover { opacity: 0.8; }

    .footer-logo img {
      display: block;
      height: 24px;
      width: auto;
    }

    @media (max-width: 600px) {
      .topnav { padding: 0 16px; }
      .topnav-brand img { height: 22px; }
      main { padding: 32px 16px; }
      .container { padding: 26px 20px 28px; }

      .footer-inner {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <nav class="topnav">
    <div class="topnav-inner">
      <a class="topnav-brand" href="/"><img src="/image/logo.png" alt="どんまうんど" width="720" height="151"><span>Tools</span></a>
      <a class="topnav-site" href="https://donnma.com/" target="_blank" rel="noopener">
        <span class="topnav-site-dot"></span>
        donnma.com
      </a>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="error-icon" aria-hidden="true"></div>
      <div class="error-code">404</div>
      <h1 class="error-title">ページが見つかりませんでした</h1>
      <p class="error-desc">
        お探しのページは存在しないか、移動・削除された可能性があります。<br>
        URLをご確認のうえ、トップページからお探しください。
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/">トップページへ戻る</a>
        <a class="btn btn-secondary" href="https://donnma.com/" target="_blank" rel="noopener">オフィシャルサイト</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <a class="footer-logo" href="https://donnma.com/" target="_blank" rel="noopener"><img src="/image/logo.png" alt="どんまうんど" width="720" height="151"></a>
      <span>© 2026 <a href="https://donnma.com/" target="_blank" rel="noopener">donnma.com</a> / <a href="https://twitter.com/donnma777" target="_blank" rel="noopener">@donnma777</a></span>
    </div>
  </footer>

</body>
</html>
